[package]
name = "paypal-rs"
version = "0.1.0"
authors = ["flowxd137 (contact@onigiri.software)"]
repository = "https://github.com/windify-vn/paypal-rs"
edition = "2024"
description = "Rust library for the Paypal API"
keywords = ["paypal", "api", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["default-tls","blocking"]
blocking = ["reqwest/blocking"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
spec = []

[dependencies]
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
dyn-clone = "1.0.20"
serde_with = "3"

chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
    "std",
    "wasmbind",
] }

strum = { version = "0.27", features = ["derive", "strum_macros"] }

jsonwebtoken = "9.3"
base64 = "0.22"

thiserror = "2"
typed-builder = "0.21"
url = "2.5"

bytes = "1.10"


[dev-dependencies]

